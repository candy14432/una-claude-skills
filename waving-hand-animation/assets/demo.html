<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Waving Hand Animation — Demo</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 24px;
    background: #f4f5f7;
    font-family: "Noto Sans TC", system-ui, -apple-system, sans-serif;
    color: #1e1e1e;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 32px;
  }
  h1 { font-size: 20px; margin: 0; }
  .grid {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    justify-content: center;
  }
  .card {
    width: 220px;
    background: #fff;
    border-radius: 12px;
    padding: 28px 20px 22px;
    box-shadow: 0 1px 4px rgba(0,0,0,.08);
    text-align: center;
  }
  .card h2 { font-size: 14px; color: #676767; font-weight: 500; margin: 0 0 18px; }
  .big { font-size: 44px; }

  .btn {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 10px 18px;
    border: none;
    border-radius: 999px;
    background: #fff0f0;
    color: #c2292e;
    font: 500 16px/1.4 inherit;
    cursor: pointer;
  }

  /* ---- The reusable waving animation ---- */
  .wave {
    display: inline-block;
    transform-origin: 55% 85%;
    animation: hand-wave 3.2s ease-in-out infinite;
    will-change: transform;
  }
  @keyframes hand-wave {
    0%, 60%, 100% { transform: scale(1) rotate(0deg); }
    8%            { transform: scale(1.3) rotate(0deg); }
    18%           { transform: scale(1.3) rotate(-16deg); }
    28%           { transform: scale(1.3) rotate(13deg); }
    38%           { transform: scale(1.3) rotate(-9deg); }
    46%           { transform: scale(1.3) rotate(6deg); }
    53%           { transform: scale(1.12) rotate(0deg); }
  }

  /* Hover-only variant: idle at rest, wave (faster) on hover/focus */
  .wave--hover { display: inline-block; transform-origin: 55% 85%; }
  .btn:hover .wave--hover,
  .btn:focus-visible .wave--hover { animation: hand-wave 1.1s ease-in-out; }

  @media (prefers-reduced-motion: reduce) {
    .wave, .wave--hover { animation: none !important; }
  }
</style>
</head>
<body>
  <h1>揮手動畫 · Waving Hand</h1>
  <div class="grid">
    <div class="card">
      <h2>Emoji（idle loop）</h2>
      <div class="big"><span class="wave">👋</span></div>
    </div>

    <div class="card">
      <h2>Inline SVG（idle loop）</h2>

        <defs><linearGradient id="g" x1="10" y1="0.5" x2="10" y2="19.5" gradientUnits="userSpaceOnUse">
          <stop stop-color="#ED4B50"/><stop offset="1" stop-color="#C2292E"/>
        </linearGradient></defs>
      </svg>
    </div>

    <div class="card">
      <h2>Hover the button</h2>
      <button class="btn"><span class="wave--hover">👋</span> 提問</button>
    </div>
  </div>
</body>
</html>
